name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: |
          npm install
          sudo apt-get install -y imagemagick
      - name: Config
        run: |
          mkdir -p www
          echo '<!doctype html><title>ALL Sports</title>' > www/index.html
          cat > capacitor.config.json <<EOF2
          {
            "appId": "com.allsports.live",
            "appName": "ALL Sports",
            "webDir": "www",
            "server": {
              "url": "https://all-sports.pages.dev/",
              "androidScheme": "https"
            }
          }
          EOF2
      - name: Android
        run: |
          npx cap add android
          npx cap sync android
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            dir=android/app/src/main/res/mipmap-$n
            convert icon-512.png -resize ${s}x${s} $dir/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $dir/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: allsports-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
