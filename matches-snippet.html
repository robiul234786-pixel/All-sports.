<!-- index.html এ যেখানে ম্যাচ দেখাতে চাও সেখানে বসাও -->
<div id="days" style="display:flex;gap:8px;overflow-x:auto;padding:8px 0"></div>
<div id="list"></div>
<div id="lu" style="display:none;position:fixed;inset:0;background:#000d;overflow:auto;padding:16px;z-index:99"></div>

<script>
const dhaka = (d) => new Date(d.getTime() + 6 * 3600e3).toISOString().slice(0, 10);
let cur = dhaka(new Date());

function buildDays() {
  const box = document.getElementById("days");
  box.innerHTML = "";
  for (let i = -3; i <= 10; i++) {
    const d = dhaka(new Date(Date.now() + i * 864e5));
    const b = document.createElement("button");
    b.textContent = i === 0 ? "আজ" : d.slice(5);
    b.style.cssText = "padding:8px 12px;border-radius:16px;border:0;white-space:nowrap;" +
      (d === cur ? "background:#6c6cff;color:#fff" : "background:#222;color:#ccc");
    b.onclick = () => { cur = d; buildDays(); load(); };
    box.appendChild(b);
  }
}

async function load() {
  const list = document.getElementById("list");
  list.textContent = "লোড হচ্ছে...";
  const r = await (await fetch("/api/matches?date=" + cur)).json();
  const groups = {};
  r.matches.forEach((m) => (groups[m.league.name] = groups[m.league.name] || []).push(m));
  // জাতীয় দলের ম্যাচ উপরে
  const names = Object.keys(groups).sort((a, b) => groups[b][0].national - groups[a][0].national);
  list.innerHTML = names.map((n) =>
    `<h4 style="margin:14px 0 6px">${n}</h4>` +
    groups[n].map((m) => {
      const t = new Date(m.time).toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Dhaka" });
      const sc = m.status === "NS" ? t : `${m.home.goals ?? 0} - ${m.away.goals ?? 0}`;
      return `<div onclick="lineup(${m.id})" style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#1b1f23;border-radius:10px;margin:4px 0">
        <span>${m.home.name}</span><b>${sc}</b><span>${m.away.name}</span></div>`;
    }).join("")
  ).join("") || "এই তারিখে কোনো ম্যাচ নেই";
}

async function lineup(id) {
  const box = document.getElementById("lu");
  box.style.display = "block";
  box.textContent = "লোড হচ্ছে...";
  const r = await (await fetch("/api/lineup?fixture=" + id)).json();
  const head = r.type === "official" ? "অফিসিয়াল লাইনআপ" : r.type === "probable" ? r.note : "লাইনআপ এখনো নেই";
  box.innerHTML = `<button onclick="this.parentNode.style.display='none'" style="float:right">✕</button><h3>${head}</h3>` +
    r.teams.map((t) => `<h4>${t.team} ${t.formation ? "(" + t.formation + ")" : ""}</h4>` +
      t.xi.map((p) => `<div>${p.n} ${p.name} <small>${p.pos}</small></div>`).join("")).join("");
}

buildDays(); load();
</script>
